# Generate the Xcode project with XcodeGen:
#   brew install xcodegen && xcodegen generate && open ShoppingCart.xcodeproj
name: ShoppingCart
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShoppingCart:
    type: application
    platform: iOS
    sources: [ShoppingCart]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShoppingCart
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ShoppingCartTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShoppingCartTests]
    dependencies:
      - target: ShoppingCart
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShoppingCartTests
schemes:
  ShoppingCart:
    build:
      targets:
        ShoppingCart: all
        ShoppingCartTests: [test]
    test:
      targets: [ShoppingCartTests]
